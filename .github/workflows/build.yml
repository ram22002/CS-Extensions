name: Build CloudStream Plugins

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source (main)
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -rf $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/icons

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --no-daemon
          python tools/update_plugins.py

          # Copy outputs to builds branch
          cp *.cs3 $GITHUB_WORKSPACE/builds/
          cp plugins.json $GITHUB_WORKSPACE/builds/
          cp repo.json $GITHUB_WORKSPACE/builds/
          cp -r icons $GITHUB_WORKSPACE/builds/

      - name: Push to builds branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "ramlakhanregar1+github@gmail.com"
          git config --local user.name "ram22002"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit --author="ram22002 <ramlakhanregar1+github@gmail.com>" -m "Auto-build plugins for $GITHUB_SHA [skip ci]"
            git push origin builds
          else
            echo "No changes in builds"
          fi
