name: Build CloudStream Plugins

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make --no-daemon

      - name: Commit and Push Updated Plugins
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build .cs3 extensions and update repository [skip ci]"
          file_pattern: "*.cs3 plugins.json"
          commit_user_name: "ram22002"
          commit_user_email: "ramlakhanregar1+github@gmail.com"
          commit_author: "ram22002 <ramlakhanregar1+github@gmail.com>"
